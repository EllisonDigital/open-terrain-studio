# OpenTerrainStudio CI
#
# Every pipeline: fmt, clippy, DCO (merge requests), tests and a headless Godot
# smoke test. Merge requests and main also export the Linux app.
#
# Tags (v*): build the Rust library on Linux, Windows and macOS, export all
# three apps on Linux (Godot exports every desktop platform from Linux), upload
# the zips to the Generic Package Registry and create a GitLab Release.
#
# Runners. Linux jobs use GitLab's hosted runners. Windows and macOS only build
# the Rust library, on the runners named by WINDOWS_RUNNER_TAG and
# MACOS_RUNNER_TAG:
#   - saas-windows-medium-amd64: GitLab-hosted Windows, available on all plans.
#   - saas-macos-medium-m1: GitLab-hosted macOS, Premium and Ultimate only.
# Without hosted runners, register self-hosted ones (shell executor, Rust via
# rustup; macOS also needs Xcode command line tools for lipo) and set these two
# variables in Settings > CI/CD > Variables, e.g. to "windows" and "macos".

stages:
  - check
  - test
  - build
  - package
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: "always"
  RUST_IMAGE: "rust:1.95-bookworm"
  # The Godot used for smoke tests and exports is pinned in .godot-version.
  # Oldest Godot the extension supports (it is built against the 4.6 API).
  GODOT_MIN_VERSION: "4.6.2"
  WINDOWS_RUNNER_TAG: "saas-windows-medium-amd64"
  MACOS_RUNNER_TAG: "saas-macos-medium-m1"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/openterrainstudio"

# Merge request pipelines for branches with an open MR, branch pipelines
# otherwise, and tag pipelines; never both for the same push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: $RUST_IMAGE
  interruptible: true

.cargo-cache:
  cache:
    key:
      files: [Cargo.lock]
      prefix: "$CI_JOB_NAME_SLUG"
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - target/

# ---- check -----------------------------------------------------------------

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: check
  extends: .cargo-cache
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

dco:
  stage: check
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache git
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      missing=0
      for c in $(git rev-list "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"); do
        if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
          echo "Commit $c has no Signed-off-by line (use git commit -s)"; missing=1
        fi
      done
      exit $missing

# ---- test ------------------------------------------------------------------

test:
  stage: test
  extends: .cargo-cache
  script:
    - cargo test --workspace

.godot-cache:
  cache:
    - key:
        files: [Cargo.lock]
        prefix: "$CI_JOB_NAME_SLUG"
      paths: [.cargo-home/registry/, .cargo-home/git/, target/]
    - key:
        files: [.godot-version]
        prefix: "godot"
      paths: [.godot-cache/]

# Loads the real extension into headless Godot and exercises the whole API.
godot-smoke:
  stage: test
  extends: .godot-cache
  script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - export GODOT="$(scripts/fetch-godot.sh)"
    - cargo build -p terrain-godot
    # First-time `--import` of a project with a GDExtension segfaults on exit inside
    # Godot (4.6 and 4.7) after the import has finished; the import itself is fine.
    - $GODOT --headless --path app --import || true
    - $GODOT --headless --path app --script res://tests/smoke_test.gd
    - $GODOT --headless --path app --script res://tests/erosion_test.gd

# Same smoke test on the oldest supported Godot (compatibility_minimum = 4.6).
godot-smoke-min:
  extends: godot-smoke
  script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - export GODOT="$(scripts/fetch-godot.sh "$GODOT_MIN_VERSION")"
    - cargo build -p terrain-godot
    - $GODOT --headless --path app --import || true
    - $GODOT --headless --path app --script res://tests/smoke_test.gd
    - $GODOT --headless --path app --script res://tests/erosion_test.gd

# ---- build: release library per OS ------------------------------------------

lib-linux:
  stage: build
  extends: .cargo-cache
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo build --release -p terrain-godot
    - mkdir -p dist && cp target/release/libterrain_godot.so dist/
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Windows and macOS: required on tags, manual (and allowed to fail) elsewhere so
# a missing runner never blocks ordinary pipelines.
.lib-other-os:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  artifacts:
    paths: [dist/]
    expire_in: 1 week

lib-windows:
  extends: .lib-other-os
  tags: [$WINDOWS_RUNNER_TAG]
  script:
    - if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe;
        .\rustup-init.exe -y --default-toolchain stable --profile minimal;
        $env:Path += ";$env:USERPROFILE\.cargo\bin" }
    - cargo build --release -p terrain-godot
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - New-Item -ItemType Directory -Force dist | Out-Null
    - Copy-Item target\release\terrain_godot.dll dist\

lib-macos:
  extends: .lib-other-os
  tags: [$MACOS_RUNNER_TAG]
  image: macos-14-xcode-15   # used by GitLab-hosted runners; ignored by shell executors
  script:
    - command -v rustup > /dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - cargo build --release -p terrain-godot --target aarch64-apple-darwin
    - cargo build --release -p terrain-godot --target x86_64-apple-darwin
    - mkdir -p dist
    - lipo -create -output dist/libterrain_godot.dylib target/aarch64-apple-darwin/release/libterrain_godot.dylib target/x86_64-apple-darwin/release/libterrain_godot.dylib

# ---- package: export the Godot app -----------------------------------------

.package:
  stage: package
  cache:
    key:
      files: [.godot-version]
      prefix: "godot"
    paths: [.godot-cache/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip zip > /dev/null
    - export GODOT="$(scripts/fetch-godot.sh --templates)"
  artifacts:
    paths: [build/*.zip]
    expire_in: 1 week

# Merge requests and main: prove the Linux export still works.
package-linux:
  extends: .package
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [lib-linux]
  script:
    - LIB_DIR=dist scripts/package.sh linux

# Tags: all three platforms, uploaded to the Generic Package Registry.
package-all:
  extends: .package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  needs: [lib-linux, lib-windows, lib-macos]
  script:
    - APP_VERSION="$(sed -n 's/^config\/version="\(.*\)"/\1/p' app/project.godot)"
    - |
      case "$CI_COMMIT_TAG" in
        "v$APP_VERSION" | "v$APP_VERSION"-*) ;;
        *) echo "Tag $CI_COMMIT_TAG doesn't match config/version $APP_VERSION in app/project.godot"; exit 1 ;;
      esac
    - LIB_DIR=dist scripts/package.sh linux windows macos
    - RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - |
      for f in build/*.zip; do
        curl --fail-with-body -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$PACKAGE_REGISTRY_URL/$RELEASE_VERSION/$(basename "$f")"
      done
    - echo "RELEASE_VERSION=$RELEASE_VERSION" >> release.env
    - echo "APP_VERSION=$APP_VERSION" >> release.env
  artifacts:
    paths: [build/*.zip]
    expire_in: 1 week
    reports:
      dotenv: release.env

# ---- release ----------------------------------------------------------------

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  needs:
    - job: package-all
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "OpenTerrainStudio $CI_COMMIT_TAG"
    description: |
      OpenTerrainStudio $CI_COMMIT_TAG. Download the zip for your system, unzip it and run OpenTerrainStudio.

      The builds are not code-signed yet. On Windows, choose "More info > Run anyway" in SmartScreen.
      On macOS, right-click OpenTerrainStudio.app and choose Open (or run
      `xattr -dr com.apple.quarantine OpenTerrainStudio.app`).
    assets:
      links:
        - name: "Windows (x86_64)"
          url: "$PACKAGE_REGISTRY_URL/$RELEASE_VERSION/OpenTerrainStudio-$APP_VERSION-windows-x86_64.zip"
          link_type: package
        - name: "macOS (universal: Apple Silicon and Intel)"
          url: "$PACKAGE_REGISTRY_URL/$RELEASE_VERSION/OpenTerrainStudio-$APP_VERSION-macos-universal.zip"
          link_type: package
        - name: "Linux (x86_64)"
          url: "$PACKAGE_REGISTRY_URL/$RELEASE_VERSION/OpenTerrainStudio-$APP_VERSION-linux-x86_64.zip"
          link_type: package
